name: Build kernel + qca_cld3_qca6750.ko (sm8635 / peridot)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Kernel branch"
        default: "lineage-23.2"
      modules_branch:
        description: "Modules branch"
        default: "lineage-23.2"
      clang_version:
        description: "Neutron clang release tag (blank = latest)"
        default: ""
      kernel_configs:
        description: "Space-separated make config targets. Blank = auto"
        default: ""
      wlan_profile:
        description: "qcacld config profile (configs/<profile>_defconfig)"
        default: "pineapple_gki_qca6750"
      modname:
        description: "Wi-Fi module name"
        default: "qca_cld3_qca6750"
      board_platform:
        description: "BOARD_PLATFORM passed to qcacld Kbuild"
        default: "pineapple"
  push:
    paths:
      - "patches/**"
      - ".github/workflows/build-kernel.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      KERNEL_REPO: https://github.com/LineageOS/android_kernel_xiaomi_sm8635
      MODULES_REPO: https://github.com/peridot-dev/android_kernel_xiaomi_sm8635-modules
      KERNEL_BRANCH: ${{ inputs.kernel_branch || 'lineage-23.2' }}
      MODULES_BRANCH: ${{ inputs.modules_branch || 'lineage-23.2' }}
      CLANG_VERSION: ${{ inputs.clang_version || '' }}
      KERNEL_CONFIGS: ${{ inputs.kernel_configs || '' }}
      WLAN_PROFILE: ${{ inputs.wlan_profile || 'pineapple_gki_qca6750' }}
      MODNAME: ${{ inputs.modname || 'qca_cld3_qca6750' }}
      BOARD_PLATFORM: ${{ inputs.board_platform || 'pineapple' }}
      WORK: ${{ github.workspace }}/work
      KERNEL_DIR: ${{ github.workspace }}/work/kernel
      MODULES_DIR: ${{ github.workspace }}/work/modules
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_BASEDIR: ${{ github.workspace }}

    steps:
      - name: Checkout (patches + workflow)
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl dwarves flex git kmod \
            libelf-dev libssl-dev patch python3 wget zstd

      - name: Download Neutron-Clang (via AntMan)
        run: |
          set -euo pipefail
          mkdir -p "$WORK/toolchain"
          cd "$WORK/toolchain"

          curl -fsSL \
            "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman" \
            -o antman
          chmod +x antman

          if [[ -n "${CLANG_VERSION:-}" ]]; then
            ./antman -S="${CLANG_VERSION}" --noconfirm --noaxel
          else
            ./antman -S --noconfirm --noaxel
          fi

          if [[ -x "$WORK/toolchain/neutron-clang/bin/clang" ]]; then
            CLANG_BIN="$WORK/toolchain/neutron-clang/bin"
          else
            CLANG_BIN="$(dirname "$(find "$WORK/toolchain" -maxdepth 5 -name clang -print -quit)")"
          fi

          if [[ -z "${CLANG_BIN:-}" || ! -e "$CLANG_BIN/clang" ]]; then
            echo "::error::Neutron clang binary not found after AntMan install"
            find "$WORK/toolchain" -maxdepth 4 | head -40
            exit 1
          fi
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          clang --version
          ld.lld --version
          llvm-nm --version

          CLANG_PATH="$(command -v clang)"
          case "$CLANG_PATH" in
            "$WORK/toolchain/"*) ;;
            *)
              echo "::error::clang resolves to $CLANG_PATH, not the Neutron toolchain under $WORK/toolchain"
              exit 1
              ;;
          esac
          echo "clang from Neutron toolchain: $CLANG_PATH"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ env.KERNEL_BRANCH }}-${{ env.CLANG_VERSION || 'neutron-latest' }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.KERNEL_BRANCH }}-${{ env.CLANG_VERSION || 'neutron-latest' }}-
            ccache-${{ env.KERNEL_BRANCH }}-

      - name: Clone kernel and modules
        run: |
          mkdir -p "$WORK" "$WORK/dist" "$WORK/logs"
          git clone --depth=1 --branch "$KERNEL_BRANCH"  "$KERNEL_REPO"  "$KERNEL_DIR"
          git clone --depth=1 --branch "$MODULES_BRANCH" "$MODULES_REPO" "$MODULES_DIR"

      - name: Apply patches/monitor.patch to the modules repo
        run: |
          PATCH="$GITHUB_WORKSPACE/patches/monitor.patch"
          [[ -f "$PATCH" ]] || { echo "::error::patches/monitor.patch not found"; exit 1; }
          cd "$MODULES_DIR"
          if git apply --check "$PATCH" 2>/dev/null; then
            git apply --whitespace=nowarn "$PATCH"
          else
            patch -p1 --dry-run < "$PATCH"
            patch -p1 < "$PATCH"
          fi
          git status --short

      - name: Fix OpenSSL 3.0 undeclared 'key_pass' on Ubuntu 24.04 runners
        run: |
          ROOT="$KERNEL_DIR"
          if [[ -f "$ROOT/certs/extract-cert.c" ]]; then
            sed -i '/static.*key_pass/d' "$ROOT/certs/extract-cert.c"
            sed -i '1i __attribute__((unused)) static const char *key_pass;' "$ROOT/certs/extract-cert.c"
          fi

      - name: Create make wrapper
        run: |
          cat > "$WORK/kmake" << 'EOF'
          #!/usr/bin/env bash
          exec make -j"$(nproc)" -C "$KERNEL_DIR" O="$KERNEL_DIR/out" \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="ccache clang" HOSTCC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" "$@"
          EOF
          chmod +x "$WORK/kmake"

      - name: Configure kernel (gki + pineapple + peridot), module signing off
        run: |
          cd "$KERNEL_DIR"
          CFG=arch/arm64/configs

          resolve() {
            local n="$1" c
            for c in "vendor/${n}_GKI.config" "${n}_GKI.config" \
                     "vendor/${n}.config" "${n}.config" \
                     "vendor/${n}_GKI_defconfig" "vendor/${n}_defconfig" "${n}_defconfig"; do
              if [[ -f "$CFG/$c" ]]; then echo "$c"; return 0; fi
            done
            return 1
          }

          if [[ -n "$KERNEL_CONFIGS" ]]; then
            TARGETS="$KERNEL_CONFIGS"
          else
            PINE="$(resolve pineapple || true)"
            PERI="$(resolve peridot || true)"
            [[ -n "$PINE" && -n "$PERI" ]] || {
              echo "::error::Could not auto-detect pineapple/peridot configs (got '$PINE' / '$PERI'). Re-run with kernel_configs input."
              exit 1
            }
            if [[ -f "$CFG/gki_defconfig" ]]; then
              TARGETS="gki_defconfig $PINE $PERI"
            else
              TARGETS="$PINE $PERI"
            fi
          fi
          echo "$TARGETS" > "$WORK/config_targets.txt"

          # shellcheck disable=SC2086
          "$WORK/kmake" $TARGETS

          ./scripts/config --file out/.config \
            -d MODULE_SIG \
            -d LTO_NONE -d LTO_CLANG_FULL \
            -e LTO_CLANG_THIN \
            -e CFI_CLANG \
            --set-str MODULE_SIG_KEY "" \
            --set-str SYSTEM_TRUSTED_KEYS "" \
            --set-str SYSTEM_REVOCATION_KEYS ""
          "$WORK/kmake" olddefconfig

          if grep -q '^CONFIG_MODULE_SIG=y' out/.config; then
            echo "::error::CONFIG_MODULE_SIG is still enabled after olddefconfig"
            exit 1
          fi

      - name: Build kernel (Image, Image.gz) + module prep
        run: |
          "$WORK/kmake" Image Image.gz modules_prepare modules \
              2>&1 | tee "$WORK/logs/kernel-build.log"

          test -f "$KERNEL_DIR/out/scripts/module.lds" || { echo "::error::module.lds not generated"; exit 1; }
          test -f "$KERNEL_DIR/out/Module.symvers"     || { echo "::error::Module.symvers not generated"; exit 1; }

      - name: Build ${{ env.MODNAME }}.ko against this kernel
        run: |
          WLAN="$MODULES_DIR/qcom/opensource/wlan"
          QCACLD="$WLAN/qcacld-3.0"

          INC=""
          for d in $(find "$WLAN" \( -name cnss2.h -o -name cnss_utils.h -o -name cnss_prealloc.h \) -printf '%h\n' | sort -u); do
            INC="$INC -I$d"
          done

          "$WORK/kmake" M="$QCACLD" \
            WLAN_ROOT="$QCACLD" \
            WLAN_COMMON_ROOT=../qca-wifi-host-cmn \
            WLAN_COMMON_INC="$WLAN/qca-wifi-host-cmn" \
            WLAN_FW_API="$WLAN/fw-api" \
            WLAN_FW_INC="$WLAN/fw-api" \
            WLAN_PROFILE="$WLAN_PROFILE" \
            CONFIG_QCA_CLD_WLAN_PROFILE="$WLAN_PROFILE" \
            MODNAME="$MODNAME" \
            BOARD_PLATFORM="$BOARD_PLATFORM" \
            CONFIG_QCA_CLD_WLAN=m \
            KBUILD_MODPOST_WARN=1 \
            KCPPFLAGS="$INC" \
            modules 2>&1 | tee "$WORK/logs/module-build.log"

          KO="$(find "$QCACLD" -name "$MODNAME.ko" | head -1)"
          [[ -n "$KO" ]] || { echo "::error::$MODNAME.ko was not produced"; exit 1; }
          echo "KO=$KO" >> "$GITHUB_ENV"

      - name: Verify module (patch compiled in, unsigned, vermagic matches kernel)
        run: |
          SIG="$(modinfo -F sig_id "$KO" || true)"
          [[ -z "$SIG" ]] || { echo "::error::module is signed"; exit 1; }

          COUNT="$(llvm-nm "$KO" | grep -c 'wma_injection' || true)"
          echo "wma_injection symbols: $COUNT"
          [[ "$COUNT" -gt 0 ]] || { echo "::error::FEATURE_FRAME_INJECTION_SUPPORT code is NOT in the module"; exit 1; }

          REL="$(cat "$KERNEL_DIR/out/include/config/kernel.release")"
          VM="$(modinfo -F vermagic "$KO")"
          echo "kernel.release: $REL"
          echo "vermagic:       $VM"
          [[ "$VM" == "$REL "* ]] || { echo "::error::vermagic does not match kernel.release"; exit 1; }

      - name: Collect artifacts
        run: |
          D="$WORK/dist"
          cp "$KERNEL_DIR"/out/arch/arm64/boot/Image "$KERNEL_DIR"/out/arch/arm64/boot/Image.gz "$D/"
          cp "$KO" "$D/$MODNAME.ko"
          llvm-strip --strip-debug "$D/$MODNAME.ko"
          cp "$KERNEL_DIR/out/.config" "$D/kernel.config"
          cp "$KERNEL_DIR/out/include/config/kernel.release" "$D/kernel.release"
          cp "$WORK/config_targets.txt" "$D/"
          ls -lh "$D"
          {
            echo "### Build OK"
            echo "- kernel.release: \`$(cat "$D/kernel.release")\`"
            echo "- config targets: \`$(cat "$WORK/config_targets.txt")\`"
            echo "- module: \`$MODNAME.ko\` ($(du -h "$D/$MODNAME.ko" | cut -f1))"
            echo
            echo "Flash the Image **and** use the .ko from the same run: vermagic / symbol CRCs are tied to this exact kernel build."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sm8635-kernel-and-wlan
          path: work/dist/*
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: work/logs/*
          if-no-files-found: ignore
